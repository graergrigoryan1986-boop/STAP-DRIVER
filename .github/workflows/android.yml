name: Build STAP customer and driver APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build customer and driver APKs
        run: gradle --no-daemon assembleCustomerDebug assembleDriverDebug
      - name: Upload customer APK
        uses: actions/upload-artifact@v4
        with:
          name: stap-customer-apk
          path: app/build/outputs/apk/customer/debug/app-customer-debug.apk
          if-no-files-found: error
      - name: Upload driver APK
        uses: actions/upload-artifact@v4
        with:
          name: stap-driver-apk
          path: app/build/outputs/apk/driver/debug/app-driver-debug.apk
          if-no-files-found: error
