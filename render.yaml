databases:
  - name: stap-driver-db
    plan: free
    databaseName: stap_driver
    user: stap_driver

services:
  - type: web
    name: stap-driver-api
    runtime: docker
    plan: free
    autoDeployTrigger: checksPass
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stap-driver-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://graergrigoryan1986-boop.github.io
