plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'am.stapdriver.app'
    compileSdk 35

    defaultConfig {
        applicationId 'am.stapdriver.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    flavorDimensions += 'audience'
    productFlavors {
        customer {
            dimension 'audience'
            applicationIdSuffix '.customer'
            versionNameSuffix '-customer'
            buildConfigField 'String', 'APP_ROLE', '"CUSTOMER"'
            resValue 'string', 'app_name', 'STAP Հաճախորդ'
        }
        driver {
            dimension 'audience'
            applicationIdSuffix '.driver'
            versionNameSuffix '-driver'
            buildConfigField 'String', 'APP_ROLE', '"DRIVER"'
            resValue 'string', 'app_name', 'STAP Վարորդ'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
